name: SSS Data Sync and Deploy
on:
  workflow_dispatch:
  schedule:
    # JST 09:00, 10:00, 11:00; may be delayed by GitHub
    - cron: '0 0,1,2 * * *'
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sss-sync-pages
  cancel-in-progress: false
jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Sync without VPN
        continue-on-error: true # keep deployment available while source blocks fetching
        if: ${{ vars.USE_WIREGUARD != 'true' }}
        env:
          SYNC_DAYS: '7'
          REQUEST_INTERVAL: '2.5'
        run: python scripts/sync.py
      - name: Sync via WireGuard (fail closed)
        if: ${{ vars.USE_WIREGUARD == 'true' }}
        env:
          WG_CONFIG_B64: ${{ secrets.WG_CONFIG_B64 }}
          SYNC_DAYS: '7'
          REQUEST_INTERVAL: '2.5'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wireguard-tools iptables
          bash scripts/vpn_fetch.sh
      - name: Commit collected data and failure state
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh published observations'
            git push
          fi
      - name: Assemble static site
        if: always()
        run: |
          mkdir -p site
          cp -r public/. site/
          cp -r data site/data
      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
        if: always() && github.ref == 'refs/heads/main'

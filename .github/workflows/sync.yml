name: SSS Data Sync and Deploy
on:
  workflow_dispatch:
  schedule:
    # JST 09:00, 10:00, 11:00; may be delayed by GitHub
    - cron: '0 0,1,2 * * *'
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sss-sync-pages
  cancel-in-progress: false
jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate browser JavaScript
        run: |
          python -c "from pathlib import Path; import re; h=Path('public/index.html').read_text(); [(Path('/tmp/sss-inline-%d.js'%i).write_text(code)) for i,code in enumerate(re.findall(r'<script>(.*?)</script>',h,re.S))]"
          for f in /tmp/sss-inline-*.js public/extensions.js public/color-areas.js public/island-picks.js; do node --check "$f"; done
      - name: Validate island scoring (Node)
        run: node tests/test_island_picks.cjs
      - name: Validate fallback parser
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_sync_fallback.py tests/test_area_evidence.py
          node tests/test_color_areas.cjs
      - name: Sync without VPN
        continue-on-error: true # Source may return HTTP 403; still publish status and UI
        if: ${{ vars.USE_WIREGUARD != 'true' }}
        env:
          SYNC_DAYS: '7'
          REQUEST_INTERVAL: '2.5'
        run: python scripts/sync.py
      - name: Sync via WireGuard (fail closed)
        if: ${{ vars.USE_WIREGUARD == 'true' }}
        env:
          WG_CONFIG_B64: ${{ secrets.WG_CONFIG_B64 }}
          SYNC_DAYS: '7'
          REQUEST_INTERVAL: '2.5'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wireguard-tools iptables
          bash scripts/vpn_fetch.sh
      - name: Try SloNavi public seat data if robots allow
        if: always()
        continue-on-error: true
        env:
          FALLBACK_DAYS_PER_RUN: '12'
          FALLBACK_REQUEST_INTERVAL: '3'
        run: python scripts/sync_fallback.py
      - name: Import authorized exports (even when direct fetch returned 403)
        if: always()
        run: python scripts/import_batch.py
      - name: Commit collected data and failure state
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh published observations'
            git push
          fi
      - name: Assemble static site
        if: always()
        run: |
          mkdir -p site
          cp -r public/. site/
          cp -r data site/data
      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
        if: always() && github.ref == 'refs/heads/main'

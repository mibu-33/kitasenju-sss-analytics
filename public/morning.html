<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d172b"><title>朝の仕掛け｜北千住SSS</title><style>
:root{font:15px/1.6 system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#e9effa;background:#091222}*{box-sizing:border-box}body{margin:0}header{background:#101e35;border-bottom:1px solid #263753;padding:19px max(16px,calc((100% - 1000px)/2))}main{max-width:1000px;margin:0 auto;padding:20px 16px 70px}h1{font-size:1.45rem;margin:0}h2{font-size:1.1rem;margin:0 0 12px}h3{font-size:1rem;margin:0 0 8px}.muted,small{color:#a9bbd2}a{color:#9bc3ff}nav{display:flex;gap:13px;flex-wrap:wrap}section{margin:17px 0}.panel{border:1px solid #30405c;border-radius:14px;padding:16px;background:#112039}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.pill{display:inline-block;border:1px solid #445976;border-radius:30px;padding:4px 11px;margin:4px 4px 4px 0;font-size:.85rem}.tag{font-size:.76rem;border:1px solid #506784;padding:3px 7px;border-radius:8px;margin-left:5px}.good{color:#84e5bd}.warn{color:#ffd89c}.bad{color:#ff9ca6}select,input,button{background:#192c47;color:#f1f5ff;padding:9px 11px;border-radius:8px;border:1px solid #48607e;font:inherit}button{cursor:pointer}.row{border-top:1px solid #33445d;padding:10px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.row:first-child{border-top:0}.hint{font-size:.85rem}.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}.bignum{font-size:1.5rem;font-weight:bold}.note{font-size:.85rem;color:#b7c8de}.checkitem{margin-bottom:8px}.summary{background:#0e1b2c;border-radius:10px;padding:12px}details{margin-top:12px}summary{cursor:pointer}.mono{font-variant-numeric:tabular-nums}@media(max-width:600px){.panel{padding:13px}}
</style></head><body><header><h1>トリエス｜朝の仕掛け</h1><nav><a href="index.html">分析トップ</a><a href="floor-map.html">フロア図</a><a href="https://github.com/mibu-33/kitasenju-sss-analytics/blob/main/data/morning_2026_11.json" target="_blank" rel="noopener">元データ</a></nav></header><main><p class="note">事前告知・取材答え合わせ・推測を分離。確定していない対象は「未確認」。端末内の入力は共有・自動更新されません。</p>
<section class="panel" id="today"><h2>今日の仕掛け</h2><p>読み込み中…</p></section>
<div class="grid"><section class="panel"><h2>今月の全台🌈報告</h2><div id="rainbow"></div></section><section class="panel"><h2>ローテ進行状況</h2><div class="filters"><label>企画 <select id="rotation"></select></label></div><div id="rot"></div></section></div>
<section class="panel"><h2>朝の狙い候補一覧</h2><div class="filters"><select id="kind"><option value="all">すべて</option><option value="rotation">ローテ対象</option><option value="daily">毎日機種</option></select><input id="search" type="search" placeholder="機種・エリアを検索"></div><div class="summary" id="count"></div><div id="candidates"></div><p class="note">並び順は期待値順ではありません。ローテ対象でも「今日入る」とは限りません。4台島は過去の方針により優先候補から除外。</p></section>
<section class="panel"><h2>答え合わせ記録（この端末のみ）</h2><p class="note">確認できた日付と対象を記録すると「確認済み」表示に反映。情報源を確認してから登録してください。公式データへの自動反映はしません。</p><div class="filters"><label>日付 <input type="date" id="checkdate" value="2026-11-09"></label><label>対象 <select id="checktarget"></select></label><button id="addcheck">記録する</button><button id="clearcheck">端末の記録を消す</button></div><div id="checklog"></div></section>
<section class="panel"><h2>参照元・更新状況</h2><div id="sources"></div></section>
</main><script>
const $=id=>document.getElementById(id);let db,checked=[];const cacheKey="sss-morning-checks-v1";const escapeHtml=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function getChecks(){try{const a=JSON.parse(localStorage.getItem(cacheKey)||"[]");return Array.isArray(a)?a:[]}catch{return []}}
function current(){return db.rotations.find(x=>x.id===$("rotation").value)||db.rotations[0]}
function records(r){return [...(r.checks||[]),...checked.filter(x=>x.rotation===r.id)]}
function status(r,n){const a=records(r).filter(x=>x.target===n).sort((a,b)=>a.date.localeCompare(b.date));return a.length?{name:"確認済み",date:a[a.length-1].date}:{name:"未確認",date:null}}
function setup(){checked=getChecks();$("today").innerHTML='<h2>'+escapeHtml(db.today.date)+' の仕掛け</h2><p><b>'+db.today.themes.map(escapeHtml).join(" × ")+'</b></p><div>'+db.today.patterns.map(p=>'<span class="pill">'+escapeHtml(p)+'</span>').join("")+'</div><details><summary>店長示唆の解釈（低確度）</summary>'+db.today.hints.map(x=>'<p class="hint">'+escapeHtml(x.text)+' <span class="tag">'+escapeHtml(x.kind)+'</span></p>').join("")+'</details>';
$("rainbow").innerHTML=db.all_rainbow.map(x=>'<div class="row"><span class="mono">'+escapeHtml(x.date.slice(5))+'</span><b>'+x.names.map(escapeHtml).join("／")+'</b></div>').join("")+'<p class="note">第三者による全🌈報告。設定確定を意味しません。</p>';
$("rotation").innerHTML=db.rotations.map(x=>'<option value="'+escapeHtml(x.id)+'">'+escapeHtml(x.name)+'</option>').join("");
$("sources").innerHTML='<p>確認日：'+escapeHtml(db.as_of)+'</p>'+db.sources.map(x=>'<p><a target="_blank" rel="noopener noreferrer" href="'+escapeHtml(x.url)+'">'+escapeHtml(x.name)+'</a></p>').join("")+'<p class="note">'+escapeHtml(db.source_notice)+'</p>';render()}
function render(){let r=current(),items=r.targets,completed=items.filter(x=>status(r,x.name).name==="確認済み").length;$("rot").innerHTML='<p class="note">'+escapeHtml(r.start)+'〜'+escapeHtml(r.end||"期間終了日未確認")+'</p><p>'+escapeHtml(r.description)+'</p><p><b>確認済み '+completed+'/'+items.length+'</b>（未確認は未消化を意味しない）</p>'+items.map(x=>{const st=status(r,x.name);return '<div class="row"><span>'+escapeHtml(x.name)+'</span><span class="'+(st.date?'good':'warn')+'">'+st.name+(st.date?' '+escapeHtml(st.date.slice(5)):'')+'</span></div>'}).join("");
$("checktarget").innerHTML=items.map(x=>'<option value="'+escapeHtml(x.name)+'">'+escapeHtml(x.name)+'</option>').join("");
let kind=$("kind").value,q=$("search").value.trim().toLowerCase();let sources=[...(kind==="daily"?[]:items.map(x=>({...x,origin:"ローテ対象",status:status(r,x.name)}))),...(kind==="rotation"?[]:db.daily.map(x=>({...x,origin:"毎日機種",status:null})))];sources=sources.filter(x=>(x.name+" "+x.floor).toLowerCase().includes(q));$("count").innerHTML='<b>'+sources.length+'件</b> ／ ローテは確認済み・未確認を区別、毎日機種は対象の配分を保証しません';$("candidates").innerHTML=sources.map(x=>'<div class="row"><div><b>'+escapeHtml(x.name)+'</b> <span class="tag">'+escapeHtml(x.origin)+'</span><p class="note" style="margin:2px 0">'+escapeHtml(x.floor||"フロア未登録")+'</p></div><span class="'+(x.status?(x.status.date?'good':'warn'):'muted')+'">'+(x.status?x.status.name:"継続注目")+'</span></div>').join("");
$("checklog").innerHTML=checked.filter(x=>x.rotation===r.id).map(x=>'<div class="row"><span>'+escapeHtml(x.date)+' / '+escapeHtml(x.target)+'</span><small>この端末のみ</small></div>').join("")||'<p class="note">この端末での記録なし</p>';}
$("rotation").addEventListener("change",render);$("kind").addEventListener("change",render);$("search").addEventListener("input",render);
$("addcheck").addEventListener("click",()=>{const date=$("checkdate").value,target=$("checktarget").value,r=current();if(!date||!target||date<r.start||r.end&&date>r.end){alert("企画期間内の日付を指定してください");return}if(!confirm("答え合わせで対象を確認しましたか？"))return;checked=checked.filter(x=>!(x.rotation===r.id&&x.date===date&&x.target===target));checked.push({rotation:r.id,date,target});localStorage.setItem(cacheKey,JSON.stringify(checked));render()});
$("clearcheck").addEventListener("click",()=>{if(!confirm("この端末で保存した確認記録を消しますか？"))return;checked=[];localStorage.removeItem(cacheKey);render()});
fetch("data/morning_2026_11.json?t="+Date.now()).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{db=data;setup()}).catch(e=>$("today").innerHTML='<h2>データを取得できません</h2><p>'+escapeHtml(e.message)+'</p>');
</script></body></html>

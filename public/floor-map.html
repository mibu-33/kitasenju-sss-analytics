<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>北千住SSS | 1F・2Fフロア配置</title><style>
:root{font-family:system-ui,"Noto Sans JP",sans-serif;color:#e6edf7;background:#091323}*{box-sizing:border-box}body{margin:0}header{padding:20px;background:#142238;border-bottom:1px solid #34445e}main{max-width:1250px;margin:auto;padding:18px}h1{margin:0 0 6px;font-size:1.45rem}h2{margin:26px 0 12px}.muted,small{color:#a4b5c9}a{color:#9dc8ff}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.stat{border:1px solid #41516c;padding:12px;border-radius:10px;background:#15243a;flex:1;min-width:145px}.stat b{font-size:1.4rem;display:block}.layout{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.zone{border:1px solid #45556c;background:#132238;border-radius:14px;padding:12px;min-width:0}.zone h3{margin:0 0 9px}.group{border:1px solid #526179;border-radius:9px;padding:9px;margin:9px 0;background:#102038}.group h4{margin:0 0 7px;font-size:.95rem}.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:4px}.tile{border-radius:5px;background:#243651;border:1px solid #61728c;padding:9px 3px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}.tile.provisional{border-style:dashed;opacity:.85}.red{border-top:5px solid #f26a75}.blue{border-top:5px solid #579ff8}.green{border-top:5px solid #53bf8b}.silver{border-top:5px solid #becbd8}.gold{border-top:5px solid #efbd4a}.purple{border-top:5px solid #b68af7}.note{padding:12px;border:1px solid #465875;border-radius:9px;background:#101e32;margin:14px 0}.sources{display:flex;gap:15px;flex-wrap:wrap}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0}input{background:#132238;color:white;border:1px solid #657993;padding:10px;border-radius:8px}button{background:#233b5a;color:white;border:1px solid #7185a1;border-radius:8px;padding:9px;cursor:pointer}.group mark{background:#ecdf8c;color:#151515} .nos{color:#dfb58b}footer{margin:30px 0;font-size:12px;color:#b5c2d4}
</style></head><body><header><h1>ピーアーク北千住SSS｜フロア配置</h1><small>公式図・既存登録情報を統合した確認用マップ。実際の通路や隣接順を保証しません。</small></header>
<main><a href="./index.html">← 分析アプリへ戻る</a><div id="stats" class="stats"></div>
<div class="note"><b>読み方：</b>色別ブロック内の台番号を一覧表示しています。枠内の表示順は実際の着席順・物理的隣接を表しません。位置未確認の台は破線表示。<b>3台並びの判定には使わないでください。</b> 現在の設置状況は店内の最新掲示を優先してください。</div>
<div class="controls"><label>台番検索 <input id="filter" type="search" inputmode="numeric" placeholder="例：742"></label><button id="clear">解除</button></div>
<h2>1F</h2><div id="floor1" class="layout"></div><h2>2F</h2><div id="floor2" class="layout"></div>
<h2>照合した原資料</h2><div class="sources"><a target="_blank" rel="noopener" href="https://x.com/Kitasenjusss/status/2066121201462968359">店舗公式 1F フロア図</a><a target="_blank" rel="noopener" href="https://x.com/Kitasenjusss/status/2053440543062147221">店舗公式 2F フロア図</a><a target="_blank" rel="noopener" href="https://github.com/mibu-33/kitasenju-sss-analytics/blob/main/data/areas.csv">台番と出典の一覧（CSV）</a></div>
<footer>未登録の台や、色だけ判明している台の隣接関係は推測で補っていません。公式図の発行時点と現在の配置が異なる場合があります。</footer></main>
<script>
const colors={red:"赤",blue:"青",green:"緑",silver:"銀",gold:"金",purple:"紫"};
const order=["red","blue","green","silver","gold","purple"];let all=[];
function node(tag,cls,txt){const el=document.createElement(tag);if(cls)el.className=cls;if(txt!==undefined)el.textContent=txt;return el}
function render(){const q=document.querySelector("#filter").value.trim();for(const floor of ["1F","2F"]){let parent=document.querySelector(floor==="1F"?"#floor1":"#floor2");parent.replaceChildren();for(const color of order){let rows=all.filter(x=>x.floor===floor&&x.zone===color);if(!rows.length)continue;const section=node("section","zone "+color),heading=node("h3","",colors[color]+"エリア（"+rows.length+"台登録）");section.append(heading);let groups={};for(const x of rows){const key=x.corridor||"色のみ判明・位置未確認";(groups[key]??=[]).push(x)}for(const [label,items] of Object.entries(groups)){const group=node("div","group");group.append(node("h4","",label+"（"+items.length+"台）"));const tiles=node("div","tiles");for(const x of items.sort((a,b)=>(a.order??9999)-(b.order??9999)||a.number-b.number)){const tile=node("div","tile"+(!x.corridor?" provisional":""),String(x.number));tile.title="台番 "+x.number+"｜"+colors[color]+"｜"+(x.corridor||"物理位置未確認")+"｜根拠："+(x.confidence||"未指定");if(q&&String(x.number).includes(q))tile.style.background="#79671c";if(q&&!String(x.number).includes(q))tile.style.opacity=".23";tiles.append(tile)}group.append(tiles);section.append(group)}parent.append(section)}}}
fetch("./data/areas.json").then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{all=data;const grouped=all.filter(x=>!!x.corridor).length;let stats=document.querySelector("#stats");for(const [value,label] of [[all.length,"色が登録済みの台"],[grouped,"ブロックまで登録済み"],[all.length-grouped,"色のみ・位置未確認"],[451-all.length,"未登録（451台基準の参考値）"]]){let item=node("div","stat");item.append(node("b","",String(value)),node("small","",label));stats.append(item)}render()}).catch(e=>{document.querySelector("#stats").textContent="配置情報を読み込めませんでした："+e.message});
document.querySelector("#filter").addEventListener("input",render);document.querySelector("#clear").addEventListener("click",()=>{document.querySelector("#filter").value="";render()});
</script></body></html>

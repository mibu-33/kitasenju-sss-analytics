<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北千住SSS | 再現フロアマップ</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#091525;color:#eef4fc}*{box-sizing:border-box}body{margin:0}header{padding:16px;background:#14243b;border-bottom:1px solid #405975}h1{font-size:1.4rem;margin:0 0 5px}small,.muted{color:#aabdd1}a{color:#9bd1ff}main{max-width:1350px;margin:auto;padding:15px}button,input{font:inherit;color:inherit;background:#203751;border:1px solid #6a839f;border-radius:8px;padding:8px 11px}button{cursor:pointer}button.active{background:#416e97}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:15px 0}.notice{background:#152a42;border:1px solid #516d87;padding:12px;border-radius:10px;line-height:1.6;font-size:13px;margin-bottom:14px}.columns{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px}.scroll{overflow:auto;border:1px solid #4b637e;background:#14233a;border-radius:14px;padding:14px}.plan{width:960px;height:700px;background:#102035;border:3px solid #6b8098;border-radius:18px;position:relative}.floorname{position:absolute;top:10px;left:18px;font-size:20px;font-weight:800}.block{position:absolute;border:2px solid #768ba1;border-radius:11px;padding:9px;overflow:hidden;display:flex;flex-direction:column;gap:6px;cursor:pointer}.block h3{font-size:14px;margin:0}.block .note{font-size:10px;color:#d8e4f0}.block.blue{background:#254b78}.block.green{background:#245b45}.block.red{background:#73393d}.block.silver{background:#4d5d6f}.block.gold{background:#78602c}.block.purple{background:#533b7b}.block.placeholder{border-style:dashed}.block.on{outline:3px solid #ffe287}.seats{display:flex;flex-wrap:wrap;gap:4px;overflow:auto;min-height:0;align-content:start}.seat{min-width:37px;padding:5px 4px;text-align:center;background:#12253c9e;border:1px solid #ffffff66;border-radius:5px;font-size:11px}.seat.hit{background:#f0cc65;color:#1b2733}.aisle{position:absolute;border:1px dashed #526982;background:#1e304488;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#9eb2c8;font-size:12px;letter-spacing:3px}.facility{position:absolute;border:1px solid #748ba4;border-radius:8px;background:#27405d;padding:5px;font-size:12px}.round{position:absolute;border-radius:50%;border:3px solid #d0b3ff;background:#523778;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;cursor:pointer;padding:14px;overflow:hidden}.round.gold{background:#77602b;border-color:#f4d481}.round.on{outline:4px solid #ffe287}.round strong{font-size:12px}.round small{font-size:10px}.round .seats{justify-content:center}.detail{border:1px solid #4d6985;border-radius:13px;background:#172b43;padding:15px;line-height:1.65;overflow-wrap:anywhere}.detail h2{font-size:16px;margin:0 0 8px}.summary{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.stat{padding:8px;background:#19304a;border-radius:8px;font-size:13px}.references{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px;font-size:13px}.small{font-size:12px;color:#afc1d5}.notmapped{padding:12px;background:#172b42;border:1px dashed #718ca8;border-radius:10px;margin:15px 0;font-size:13px}@media(max-width:850px){.columns{grid-template-columns:1fr}.detail{order:-1}.plan{transform-origin:top left}}
</style></head><body><header><h1>ピーアーク北千住SSS｜店舗型フロアマップ</h1><small>図形で島・通路・円卓を描画。台番は登録データを参照。</small></header>
<main><a href="./index.html">← 分析アプリ</a><div class="toolbar"><button id="f1" class="active">1F 赤・青・緑・銀</button><button id="f2">2F 紫・金</button><input id="q" placeholder="台番号で検索" inputmode="numeric" type="search"><button id="clear">解除</button></div>
<div class="notice">公式のフロア構造を参考にした<b>図形による再現図</b>です。島の所属が確認できた台を表示していますが、<b>厳密な位置・実際の台番順・距離は未検証</b>。連番を実際の隣接台とは扱いません。色のみ確認できた台は推測で個別の島に割り当てず、別区画に表示します。</div>
<div id="stats" class="summary"></div><div class="columns"><div class="scroll"><div class="plan" id="plan"></div></div><div class="detail" id="detail"><h2>島を選択</h2>島をクリックすると所属台と根拠を表示します。</div></div>
<div class="notmapped" id="unmapped"></div>
<div class="references"><a href="https://x.com/Kitasenjusss/status/2066121201462968359" target="_blank" rel="noopener">店舗公式 1F 図</a><a href="https://x.com/Kitasenjusss/status/2053440543062147221" target="_blank" rel="noopener">店舗公式 2F 図</a><a href="https://github.com/mibu-33/kitasenju-sss-analytics/blob/main/data/areas.csv" target="_blank" rel="noopener">台番号の根拠</a></div>
<p class="small">これは店舗構造を図形化した再現途中のマップであり、現行配置の全451台を確定したものではありません。</p></main>
<script>
const plans={
"1F":{fac:[["入口",16,628],["通路",225,65,52,545],["通路",540,65,55,545],["横通路",20,302,910,45]],blocks:[
["青A","blue",40,72,160,205],["青B","blue",312,72,165,205],
["緑C","green",760,64,160,113],["緑E","green",760,188,160,113],
["緑F","green",760,356,160,113],["緑D","green",760,480,160,113],
["赤S","red",30,541,210,65],
["銀エリア","silver",305,358,190,230],
["赤エリア","red",610,355,130,250]]},
"2F":{fac:[["階段・EV",25,60],["通路",289,55,65,565],["横通路",25,290,875,49]],blocks:[
["紫B","purple",40,105,220,150],["紫A","purple",40,370,220,150],
["紫5台円卓","purple",65,552,175,110],
["金エリア","gold",385,66,250,190],
["金・未確定","gold",385,367,250,235]],
rounds:[["12台円卓","gold",675,85,210],["4台円卓A","gold",695,345,120],["4台円卓B","gold",810,490,110]]}};
let entries=[],floor="1F";
const jp={blue:"青",green:"緑",red:"赤",silver:"銀",gold:"金",purple:"紫"};
const el=(tag,cls,t)=>{let x=document.createElement(tag);if(cls)x.className=cls;if(t!==undefined)x.textContent=t;return x};
const dataFor=(name,color)=>entries.filter(x=>x.floor===floor&&(name.endsWith("エリア")||name==="金・未確定"?x.zone===color&&!x.corridor:x.corridor===name));
function show(name,color,rows,detail){const root=document.querySelector("#detail");root.replaceChildren();root.append(el("h2","",name),el("div","",rows.length+"台登録 / 色："+jp[color]));root.append(el("p","small",detail));if(rows.length){let b=el("div","seats");rows.forEach(x=>{let btn=el("button","seat",x.number);btn.onclick=()=>showSeat(x);b.append(btn)});root.append(b)}}
function showSeat(x){const d=document.querySelector("#detail");d.replaceChildren();d.append(el("h2","","台番号 "+x.number));for(const t of ["階："+x.floor,"色："+jp[x.zone],"島："+(x.corridor||"未確認"),"左右："+(x.side||"未確認"),"並び順："+(x.order??"未確認"),"出典："+(x.source||"不明")])d.append(el("p","small",t))}
function block(v){let [name,color,x,y,w,h]=v,rows=dataFor(name,color),b=el("section","block "+color+(rows.every(x=>x.order==null)?" placeholder":""));Object.assign(b.style,{left:x+"px",top:y+"px",width:w+"px",height:h+"px"});b.append(el("h3","",name),el("span","note",rows.length+"台／並び順未確定"));let seats=el("div","seats"),q=document.querySelector("#q").value.trim();for(const r of rows.sort((a,b)=>a.number-b.number)){let t=el("button","seat"+(q&&String(r.number).includes(q)?" hit":""),r.number);t.onclick=e=>{e.stopPropagation();showSeat(r)};seats.append(t)}b.append(seats);b.onclick=()=>show(name,color,rows,"島・エリアの位置は参考再現。個別の台番位置と隣接関係は未検証。");return b}
function round(v){let [name,color,x,y,s]=v,rows=dataFor(name,color),b=el("section","round "+color);Object.assign(b.style,{left:x+"px",top:y+"px",width:s+"px",height:s+"px"});b.append(el("strong","",name),el("small","",rows.length?rows.map(x=>x.number).join(" / "):"台番未割当"));b.onclick=()=>show(name,color,rows,"形状のみ再現。座席と台番の対応は未確認。");return b}
function render(){document.querySelector("#f1").classList.toggle("active",floor==="1F");document.querySelector("#f2").classList.toggle("active",floor==="2F");const p=document.querySelector("#plan");p.replaceChildren();p.append(el("div","floorname",floor+" FLOOR"));for(const v of plans[floor].fac){let [label,x,y,w,h]=v,c=el("div",w?"aisle":"facility",label);Object.assign(c.style,{left:x+"px",top:y+"px"});if(w){c.style.width=w+"px";c.style.height=h+"px"}p.append(c)}plans[floor].blocks.forEach(v=>p.append(block(v)));(plans[floor].rounds||[]).forEach(v=>p.append(round(v)));let xs=entries.filter(x=>x.floor===floor),stats=document.querySelector("#stats");stats.replaceChildren();for(const [val,label] of [[xs.length,"色登録済み"],[xs.filter(x=>x.corridor).length,"島所属判明"],[xs.filter(x=>x.order!=null).length,"座席順登録済み"]])stats.append(el("div","stat",val+"台 "+label));document.querySelector("#unmapped").textContent="未登録・正確な着席位置が不明な台は図形上の正しい席へ配置できていません。登録済みで島未特定："+xs.filter(x=>!x.corridor).length+"台。";const q=document.querySelector("#q").value.trim();if(q){const hit=xs.find(x=>String(x.number)===q);if(hit)showSeat(hit)}}
document.querySelector("#f1").onclick=()=>{floor="1F";render()};document.querySelector("#f2").onclick=()=>{floor="2F";render()};document.querySelector("#clear").onclick=()=>{document.querySelector("#q").value="";render()};document.querySelector("#q").oninput=()=>{let q=document.querySelector("#q").value.trim(),hit=entries.find(x=>String(x.number)===q);if(hit)floor=hit.floor;render()};
fetch("./data/areas.json").then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(d=>{entries=d;render()}).catch(e=>{document.querySelector("#detail").textContent="配置データ取得失敗："+e.message;render()});
</script></body></html>

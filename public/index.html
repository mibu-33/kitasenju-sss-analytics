<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北千住SSS Analytics</title><meta name="theme-color" content="#102039"><link rel="manifest" href="./manifest.webmanifest"><style>
:root{font-family:system-ui,sans-serif;background:#0c1628;color:#eaf2ff}*{box-sizing:border-box}body{margin:0}header{padding:22px 18px;background:#192d49}main{max-width:1120px;margin:auto;padding:16px}h1{margin:0;font-size:1.5rem}small,p.note{color:#afc2df}a{color:#a4caff}button,input,select,textarea{background:#1d3455;border:1px solid #466183;color:#fff;border-radius:8px;padding:9px;font:inherit}button{cursor:pointer}button.on{background:#436ab0}.bar{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}.panel,.card{background:#162740;padding:14px;border:1px solid #314866;border-radius:11px;margin-bottom:12px}.card strong{display:block;font-size:1.5rem}.hide{display:none}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:.86rem}td,th{padding:9px;border-bottom:1px solid #314765;white-space:nowrap;text-align:right}td:first-child,th:first-child{text-align:left}.good{color:#70e4b0}.bad{color:#ff929b}.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}.seat{background:#223b59;border:1px solid #49607b;border-radius:8px;padding:8px;text-align:center}.seat b{display:block}textarea{width:100%;min-height:85px}h3{margin-top:0}
</style></head><body><header><h1>北千住SSS Analytics</h1><small>スロレポ × 島図 × 6のつく日 × ローテーション｜非公式</small></header><main>
<div class="bar"><select id="date"></select><select id="span"><option value="30">直近30日</option><option value="90" selected>直近90日</option><option value="9999">全期間</option></select><button id="reload">再読み込み</button><span id="state">確認中</span></div><p class="note" id="message"></p><div class="cards" id="stats"></div>
<div class="bar" id="tabs"><button class="on" data-page="all">全体</button><button data-page="machines">機種別</button><button data-page="seats">台番別</button><button data-page="island">島図・通路</button><button data-page="news">おすすめ履歴</button></div>
<section id="all"><div class="panel"><h3>日別結果</h3><div class="scroll" id="days"></div></div><div class="panel"><h3>選択日の台番ヒートマップ</h3><p class="note">台番号順であり、実際の位置は示しません。</p><div class="map" id="heat"></div></div></section>
<section id="machines" class="hide"><div class="panel"><h3>機種別実績</h3><div class="scroll" id="types"></div></div></section>
<section id="seats" class="hide"><div class="panel"><h3>台番号別・機種入替履歴</h3><input id="search" placeholder="台番号／機種で検索"><div class="scroll" id="seatTable"></div></div></section>
<section id="island" class="hide"><div class="panel"><h3>島配置の登録</h3><p class="note">台番,通路,左右,位置,開始日,終了日 のCSVを入力。配置が不明なら推定せず空欄にします。設定はこの端末のみに保存。</p><textarea id="layoutInput" placeholder="台番,通路,左右,位置,開始日,終了日"></textarea><div class="bar"><button id="importLayout">配置を登録</button><button id="saveLayout">配置JSONを書き出す</button><button id="clearLayout">端末の配置を消去</button></div><p id="layoutInfo" class="note"></p><div id="islandMap"></div></div><div class="panel"><h3>通路左右の実績</h3><div class="scroll" id="aisles"></div></div><div class="panel"><h3>隣接3台の実績</h3><div class="scroll" id="neighbors"></div></div></section>
<section id="news" class="hide"><div class="panel"><h3>毎日おすすめ・ローテーション</h3><p class="note">実際に確認した告知だけ記録。登録は端末内保存。</p><div class="bar"><input id="evDate" type="date"><select id="evType"><option>毎日おすすめ</option><option>ローテーション</option><option>特定日</option></select><input id="evMachine" placeholder="機種名"><input id="evNumber" placeholder="台番号（任意）"><button id="addEvent">登録</button><button id="exportEvents">JSON保存</button></div><div id="eventTable"></div></div><div class="panel"><h3>対象日の比較</h3><div id="eventStats"></div></div></section>
<p class="note">出典：<a href="https://www.slorepo.com/hole/e38394e383bce382a2e383bce382afe58c97e58d83e4bd8f535353code/">スロレポ・ピーアーク北千住SSS</a>。過去の差枚から設定を断定しません。</p></main>
<script>
(function(){
const $=s=>document.getElementById(s),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const fmt=n=>Math.round(+n||0).toLocaleString('ja-JP'),sign=n=>(n>0?'+':'')+fmt(n),color=n=>'<span class="'+(n>=0?'good':'bad')+'">'+sign(n)+'</span>';
const tb=(h,rs)=>rs.length?'<table><thead><tr>'+h.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rs.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'<p class="note">データがありません。</p>';
const groups=(a,k)=>{let m=new Map();a.forEach(x=>{let n=k(x);if(!m.has(n))m.set(n,[]);m.get(n).push(x)});return [...m]};
const avg=(a,k)=>a.length?a.reduce((s,x)=>s+(+x[k]||0),0)/a.length:0;
const rate=a=>a.length?100*a.filter(x=>x.diff>0).length/a.length:0;
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const locally=(k,v)=>{try{return JSON.parse(localStorage.getItem(k))||v}catch{return v}};
const download=(name,content,type)=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)};
let day=[],records=[],types=[],status={},layout=locally('sss-layout',[]),events=locally('sss-events',[]),date='',selected=[];
function paint(){
let dates=[...new Set([...day.map(x=>x.date),...records.map(x=>x.date)])].sort().reverse();if(!dates.includes(date))date=dates[0]||'';
$('date').innerHTML=dates.map(d=>'<option>'+d+'</option>').join('');$('date').value=date;
let days=+($('span').value),d0=new Date((dates[0]||'2020-01-01')+'T00:00:00+09:00');d0.setDate(d0.getDate()-days+1);let cut=d0.toISOString().slice(0,10);
let sums=day.filter(x=>x.date>=cut),r=records.filter(x=>x.date>=cut),today=r.filter(x=>x.date===date),s=day.find(x=>x.date===date);selected=r;
let tiles=[['登録台日',r.length+'台日'],['台別平均差枚',r.length?sign(avg(r,'diff'))+'枚':'未取得'],['勝率',r.length?rate(r).toFixed(1)+'%':'未取得'],['店舗日平均',s?sign(s.avg_diff)+'枚':'未取得']];
$('stats').innerHTML=tiles.map(x=>'<div class="card"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('');
$('days').innerHTML=tb(['日付','平均差枚','平均G数','勝率','対象台数'],sums.sort((a,b)=>b.date.localeCompare(a.date)).map(x=>[esc(x.date),color(x.avg_diff),fmt(x.avg_games),x.win_rate==null?'—':x.win_rate+'%',x.count==null?'—':fmt(x.count)]));
$('heat').innerHTML=today.length?today.sort((a,b)=>a.number-b.number).map(x=>'<div class="seat" title="'+esc(x.machine)+'" style="background:'+(x.diff>=0?'#20543f':'#603342')+'"><b>'+esc(x.number)+'</b>'+sign(x.diff)+'</div>').join(''):'<p class="note">台別のRAWデータ未取得</p>';
let mn=groups(r,x=>x.machine).map(([name,rs])=>({name,rs,n:rs.length,mean:avg(rs,'diff'),win:rate(rs)}));
if(!mn.length)mn=groups(types.filter(x=>x.date>=cut),x=>x.machine).map(([name,rs])=>{let n=rs.reduce((s,x)=>s+x.count,0);return{name,n,mean:n?rs.reduce((s,x)=>s+x.avg_diff*x.count,0)/n:0,win:n?100*rs.reduce((s,x)=>s+x.wins,0)/n:0}});
mn.sort((a,b)=>b.mean-a.mean);
$('types').innerHTML=tb(['機種','台日','平均差枚','勝率'],mn.map(x=>[esc(x.name),fmt(x.n),color(x.mean),x.win.toFixed(1)+'%']));
$('seatTable').innerHTML=tb(['台番','最新機種','台日','平均差枚','勝率'],groups(r,x=>x.number).filter(([n,a])=>(n+' '+a[0].machine).includes($('search').value)).map(([n,a])=>[esc(n),esc(a.slice().sort((p,q)=>q.date.localeCompare(p.date))[0].machine),a.length,color(avg(a,'diff')),rate(a).toFixed(1)+'%']));
let active=layout.filter(x=>(!x.from||x.from<=date)&&(!x.to||x.to>=date));
$('islandMap').innerHTML=groups(active,x=>x.corridor).map(([name,a])=>'<div class="panel"><h4>'+esc(name)+'通路</h4>'+['左','右'].map(side=>'<p>'+side+' '+a.filter(x=>x.side===side).sort((p,q)=>p.order-q.order).map(x=>{let y=today.find(t=>t.number===x.number);return '<span class="seat">'+x.number+':'+(y?sign(y.diff):'—')+'</span>'}).join('　')+'</p>').join('')+'</div>').join('')||'<p class="note">配置未登録</p>';
let loc=groups(active,x=>x.corridor+' '+x.side).map(([key,a])=>{let rs=r.filter(x=>a.some(p=>p.number===x.number&&(!p.from||p.from<=x.date)&&(!p.to||p.to>=x.date)));return {key,rs}});
$('aisles').innerHTML=tb(['通路・左右','台日','平均差枚'],loc.filter(x=>x.rs.length).map(x=>[esc(x.key),x.rs.length,color(avg(x.rs,'diff'))]));
let ns=[];for(let [name,a] of groups(active,x=>x.corridor+' '+x.side)){a.sort((p,q)=>p.order-q.order);for(let i=0;i+2<a.length;i++){let l=a.slice(i,i+3);if(l[2].order!==l[0].order+2)continue;let rs=r.filter(x=>l.some(p=>p.number===x.number));if(rs.length)ns.push([esc(name)+' / '+l.map(x=>x.number).join('-'),rs.length,color(avg(rs,'diff'))])}}
$('neighbors').innerHTML=tb(['並び','台日','平均差枚'],ns);
$('eventTable').innerHTML=tb(['日付','種類','機種','台番'],events.map(x=>[esc(x.date),esc(x.type),esc(x.machine),esc(x.number||'—')]));
$('eventStats').innerHTML=tb(['機種','対象日平均','通常日平均'],groups(events,x=>x.machine).map(([m,ev])=>{let set=new Set(ev.map(x=>x.date)),all=types.filter(x=>x.machine===m),yes=all.filter(x=>set.has(x.date)),no=all.filter(x=>!set.has(x.date));return yes.length&&no.length?[esc(m),color(avg(yes,'avg_diff')),color(avg(no,'avg_diff'))]:null}).filter(Boolean));
}
async function reload(){try{let all=await Promise.all(['summary','records','machine_daily','status','layout','events'].map(async n=>{let r=await fetch('data/'+n+'.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(n+': HTTP '+r.status);return r.json()}));[day,records,types,status]=all;if(!localStorage.getItem('sss-layout'))layout=all[4];if(!localStorage.getItem('sss-events'))events=all[5];let recent=status.newest_date||null,stale=recent?Date.now()-new Date(recent+'T23:59:59+09:00').getTime()>172800000:false;$('state').textContent=status.status==='error'?'取得エラー':stale?'更新遅延':status.status==='ok'?'取得成功':status.status==='partial'?'一部取得':'データ待ち';$('message').textContent='掲載最新日: '+(recent||'なし')+' / 最終実行: '+(status.last_attempt||'なし')+' / 台別記録: '+records.length+'件'+(status.error?' / '+status.error:'');paint()}catch(e){$('state').textContent='読込失敗';$('message').textContent=e.message}}
$('reload').onclick=reload;$('date').onchange=e=>{date=e.target.value;paint()};$('span').onchange=paint;$('search').oninput=paint;
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-page]').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('main section').forEach(x=>x.classList.add('hide'));$(b.dataset.page).classList.remove('hide')});
$('importLayout').onclick=()=>{let c=0;for(let line of $('layoutInput').value.trim().split(/\r?\n/)){let x=line.split(',').map(x=>x.trim()),n=+x[0],o=+x[3];if(!n||!o||!x[1]||!['左','右'].includes(x[2]))continue;layout.push({number:n,corridor:x[1],side:x[2],order:o,from:x[4]||'',to:x[5]||''});c++}save('sss-layout',layout);$('layoutInfo').textContent=c+'件登録';paint()};
$('clearLayout').onclick=()=>{if(confirm('この端末の配置情報を消去しますか？')){layout=[];save('sss-layout',layout);paint()}};
$('saveLayout').onclick=()=>download('sss-layout.json',JSON.stringify(layout,null,2),'application/json');
$('evDate').value=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});
$('addEvent').onclick=()=>{if(!$('evDate').value||!$('evMachine').value.trim())return alert('日付と機種を入力');events.push({date:$('evDate').value,type:$('evType').value,machine:$('evMachine').value.trim(),number:$('evNumber').value.trim()});save('sss-events',events);paint()};
$('exportEvents').onclick=()=>download('sss-events.json',JSON.stringify(events,null,2),'application/json');
reload();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
